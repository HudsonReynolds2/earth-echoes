[project]
name = "eoe-backend"
version = "0.0.0"
description = "Echoes of Earth management platform: backend"
requires-python = ">=3.12,<3.13"
dependencies = [
    "uvicorn>=0.34",
    "sqlalchemy>=2.0",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "fastapi>=0.115",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "argon2-cffi>=23.1",
    "email-validator>=2.2",
    "cryptography>=44.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
    "mypy>=1.14",
    "pyyaml>=6.0",
    "httpx>=0.28",
]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
markers = [
    "integration: exercises the real Docker compose stack; a hard gate prerequisite (rule R0)",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[project]
name = "eoe-backend"
version = "0.0.0"
description = "Echoes of Earth management platform: backend"
requires-python = ">=3.12,<3.13"
dependencies = [
    "uvicorn>=0.34",
    "sqlalchemy>=2.0",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "fastapi>=0.115",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "argon2-cffi>=23.1",
    "email-validator>=2.2",
    "cryptography>=44.0",
    "pyotp>=2.9",
    "httpx>=0.28",
    "aiomqtt>=2.3",
    # E5.4e: the object-storage tester. boto3 rather than a hand-rolled SigV4
    # signer because SigV4 against MinIO, Ceph and real S3 differs in exactly
    # the details a hand-rolled signer gets wrong (path vs virtual-host
    # addressing, region resolution, chunked payload signing). It is
    # synchronous, so every call goes through `asyncio.to_thread`, following
    # `controlplane/broker.py`'s precedent.
    "boto3>=1.35",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
    "mypy>=1.14",
    "pyyaml>=6.0",
    "hypothesis>=6.100",
    "pytest-timeout>=2.4.0",
    "pytest-xdist>=3.8.0",
]

[tool.mypy]
python_version = "3.12"
strict = true

# boto3 and botocore ship no type information and no py.typed marker (E5.4e).
# The alternative is `boto3-stubs`, which is generated, very large, and would
# have to stay version-pinned against boto3 forever; the code that touches it
# is one small module (app/services/clients/s3.py) whose own signatures are
# fully typed, so the untyped surface stops at its boundary instead of
# spreading. `strict = true` is NOT relaxed anywhere else.
[[tool.mypy.overrides]]
module = ["boto3.*", "botocore.*"]
ignore_missing_imports = true

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# --durations surfaces the slow tests without asking; the timeout is the gate's
# deadman switch (D98). 300s is far above any healthy test here and far below
# "I have been staring at a hung terminal for ten minutes": a test that blocks
# on a wedged Docker socket or a broker that never accepts now DIES and names
# itself, instead of holding the whole gate hostage. Tests that legitimately
# build container images carry their own longer @pytest.mark.timeout.
addopts = "-ra --durations=10 --timeout=300 --timeout-method=thread -n 6 --dist loadgroup"
markers = [
    "integration: exercises the real Docker compose stack; a hard gate prerequisite (rule R0)",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

# Dev compose stack (E0.1; spec section 15.1). Fixed ports per
# phase-0-foundations.md section 2 as amended (PHASE0-2-02): host ports are
# API 18000, frontend 15173, Postgres 15432, Redis 16379, MQTT/TLS 18883.
# Only the HOST side moved; every container still listens on its standard
# port, so images, uvicorn/vite arguments and mosquitto.conf are unchanged
# and service-to-service URLs inside the network keep using 5432/6379/8883.
# Values come from the environment or a .env file beside this file;
# deploy/.env.example documents the names, never values.

services:
  api:
    build:
      context: ../backend
      args:
        BUILD_SHA: ${BUILD_SHA:-dev}
    ports:
      - "18000:8000"
    environment:
      DATABASE_URL: ${DATABASE_URL:?set in deploy/.env, see .env.example}
      EOE_SESSION_SECRET: ${EOE_SESSION_SECRET:?set in deploy/.env, see .env.example}
      EOE_KEK: ${EOE_KEK:?set in deploy/.env, see .env.example}
      REDIS_URL: ${REDIS_URL:-}
      EOE_CORS_ORIGINS: ${EOE_CORS_ORIGINS:-http://localhost:15173}
      EOE_PUBLISH_ENABLED: ${EOE_PUBLISH_ENABLED:-true}
    depends_on:
      postgres:
        condition: service_healthy

  # The reconciliation worker (E3.7; spec 3.1 draws Workers as their own box,
  # D59). Same image and same module as the API — `EOE_WORKER_IN_API` runs it
  # inside the API process instead, for the single-container deployment.
  worker:
    build:
      context: ../backend
      args:
        BUILD_SHA: ${BUILD_SHA:-dev}
    command:
      ["/srv/backend/.venv/bin/python", "-m", "app.controlplane.runner"]
    environment:
      DATABASE_URL: ${DATABASE_URL:?set in deploy/.env, see .env.example}
      # Required by Settings even though the worker holds no sessions; it
      # reads broker passwords through SecretStore, which needs the KEK.
      EOE_SESSION_SECRET: ${EOE_SESSION_SECRET:?set in deploy/.env, see .env.example}
      EOE_KEK: ${EOE_KEK:?set in deploy/.env, see .env.example}
      EOE_TIMEOUT_SWEEP_SECONDS: ${EOE_TIMEOUT_SWEEP_SECONDS:-30}
      EOE_DRIFT_SWEEP_SECONDS: ${EOE_DRIFT_SWEEP_SECONDS:-300}
    # The shared image's HEALTHCHECK probes the API's HTTP port, which this
    # process does not have, so this replaces it rather than inheriting it.
    # It was `disable: true` until CI refused: `compose up --wait` errors with
    # "has no healthcheck configured" on the runner's Compose, while the local
    # one tolerated it — so the gate was green here and red there (D92).
    #
    # This is a REAL check, and the original comment's point stands: a green
    # tick that proves nothing is worse than no tick. The worker writes the
    # stamp only while BOTH sweep tasks are alive, so the failure it actually
    # catches is the one that matters — a sweep dying while the process stays
    # up holding its broker connection, which from outside is indistinguishable
    # from a healthy fleet.
    healthcheck:
      test:
        - CMD-SHELL
        - test $$(( $$(date +%s) - $$(stat -c %Y /tmp/eoe-worker.heartbeat) )) -lt 30
      interval: 10s
      timeout: 5s
      retries: 3
      # The stamp appears once the sweeps are running; until then the file does
      # not exist and `stat` fails, which is correct and must not be counted
      # against the container while it is still starting.
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      mosquitto:
        condition: service_healthy

  frontend:
    build:
      context: ../frontend
      target: dev
    ports:
      - "15173:5173"
    environment:
      # Browser-perspective API URL (decision D2: no proxy, cross-origin by
      # design). Readiness flight E0-R fixed this missing plumbing (D19).
      VITE_API_BASE_URL: ${EOE_FRONTEND_API_URL:-http://localhost:18000}

  postgres:
    image: postgres:16-alpine
    ports:
      - "15432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set in deploy/.env, see .env.example}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in deploy/.env, see .env.example}
      POSTGRES_DB: ${POSTGRES_DB:?set in deploy/.env, see .env.example}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "16379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Dev control-plane broker (E3.1; spec 7.1). ./dev-certs is GENERATED and
  # gitignored — run `uv run python -m app.devbroker --certs-only` before the
  # first `compose up`, then the full run once deployments exist.
  mosquitto:
    image: eclipse-mosquitto:2
    ports:
      - "18883:8883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./dev-certs:/mosquitto/dev:ro
      - mosquitto_data:/mosquitto/data
    healthcheck:
      # A TLS handshake against the listener; -z exits 0 only once Mosquitto is
      # actually accepting connections, which `--wait` then gates the API on.
      test: ["CMD-SHELL", "nc -z 127.0.0.1 8883 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
  mosquitto_data:

# Development MQTT broker (task E3.1; spec 7.1).
#
# The real topology is one Mosquitto per deployment on its KVM host; dev runs
# a single container serving every deployment's namespace, with each account
# cut to its own slice by the generated ACL file so isolation is still real.
#
# Everything under /mosquitto/dev is GENERATED and gitignored:
#   uv run python -m app.devbroker --certs-only   # certs + empty account files
#   uv run python -m app.devbroker                # accounts, ACLs, service rows
#
# TLS only: there is deliberately no plaintext listener. Spec 7.1 mandates TLS
# for the control plane, and a dev broker that also speaks 1883 grows client
# code that quietly works without certificates.

listener 8883
protocol mqtt

cafile /mosquitto/dev/ca.crt
certfile /mosquitto/dev/server.crt
keyfile /mosquitto/dev/server.key

# Aggregators authenticate with username/password over TLS. mTLS is the "where
# the deployment supports it" half of spec 7.1 and belongs to E8, not to E5's
# onboarding as this comment claimed until E5.8a: E5 ships no mTLS, so the
# promise is withdrawn rather than left standing in a file nobody rereads.
# Client certificates are accepted if offered and never required.
require_certificate false
tls_version tlsv1.2

allow_anonymous false
password_file /mosquitto/dev/passwd
acl_file /mosquitto/dev/acl

# Retained desired messages must survive a broker restart: spec 6.4's reconnect
# property is the whole reason the desired topics are retained, and E3.7's
# "worker survives restart" acceptance leans on it.
persistence true
persistence_location /mosquitto/data/
autosave_interval 30

log_dest stdout
log_type error
log_type warning
log_type notice
connection_messages true
